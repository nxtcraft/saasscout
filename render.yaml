services:
  - type: web
    name: saasscout
    env: python
    buildCommand: pip install -r requirements.txt && python pipeline.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AFFILIATE_TAG
        value: saasscout-20
      - key: PARTNER_ID
        value: ""
    autoDeploy: true

name: Daily Deal Ingestion

on:
  schedule:
    - cron: "0 0 * * *"   # midnight UTC every day
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG || 'saasscout-20' }}
          PARTNER_ID: ${{ secrets.PARTNER_ID || '' }}
        run: python pipeline.py

      - name: Run tests
        run: pytest test_pipeline.py -v

      - name: Commit fresh deal data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refresh deals [skip ci]"
          file_pattern: "data/latest_deals.json"
          commit_user_name: "SaasScout Bot"
          commit_user_email: "bot@saasscout.dev"

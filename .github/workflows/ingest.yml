name: Daily Deal Ingestion

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG || 'saasscout-20' }}
          PARTNER_ID: ${{ secrets.PARTNER_ID || '' }}
        run: python pipeline.py

      - name: Run tests
        run: pytest test_pipeline.py -v

      - name: Build static site
        run: python build_site.py

      - name: Commit fresh deal data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refresh deals [skip ci]"
          file_pattern: "data/latest_deals.json"
          commit_user_name: "SaasScout Bot"
          commit_user_email: "bot@saasscout.dev"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
